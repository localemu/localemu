<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LocalEmu Console</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/_localemu/dashboard/static/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/_localemu/dashboard/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/_localemu/dashboard/static/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/_localemu/dashboard/static/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/_localemu/dashboard/static/apple-touch-icon.png">
<script src="/_localemu/dashboard/static/js/theme.js"></script>
<script src="/_localemu/dashboard/static/js/layout.js"></script>
<link rel="stylesheet" href="/_localemu/dashboard/static/css/fonts.css">
<link rel="stylesheet" href="/_localemu/dashboard/static/css/console.css">
<link rel="stylesheet" href="/_localemu/dashboard/static/css/drills.css">
</head>

<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Toggle service menu" title="Toggle service menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/" id="brandLink" aria-label="LocalEmu overview">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LocalEmu</span>
      <span class="brand-ver" id="brandVer"></span>
    </a>
    <button class="search-trigger" id="searchBtn" type="button" aria-label="Search services, resources and actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span id="searchHint">Search services, resources, actions</span>
      <kbd>&#8984;K</kbd>
    </button>
    <span class="top-sp"></span>
    <div class="top-right">
      <button class="acct-btn" id="acctBtn" type="button" aria-haspopup="true" aria-label="Switch account">
        <span class="acct-swatch" id="acctSwatch"></span>
        <span class="acct-id" id="acctId">000000000000</span>
        <span class="acct-alias" id="acctAlias"></span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="region" id="regionBadge" title="Default region"></span>
      <button class="live offline" id="liveBtn" type="button" title="Live event stream (SSE). Click to pause the live panel.">
        <span class="led"></span><span class="lt" id="liveText">Connecting</span>
      </button>
      <button class="icon-btn" id="wireShowBtn" type="button" aria-label="Show live API calls panel" title="Show live API calls panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <nav class="nav" id="nav" aria-label="Services">
      <div class="nav-primary">
        <button class="nav-link" data-route="overview" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </button>
        <button class="nav-link" data-route="cloudtrail" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          CloudTrail events <span class="badge num" id="ctBadge">0</span>
        </button>
        <button class="nav-link" data-route="accounts" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>
          Accounts <span class="badge num" id="acctBadge">0</span>
        </button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label class="nav-filter" for="navFilter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <input id="navFilter" type="text" placeholder="Filter services" autocomplete="off" aria-label="Filter services">
        </label>
        <div class="nav-hint" id="navHint">Pinned and in-use services. Type to find the rest.</div>
      </div>
      <div id="navGroups" style="display:flex;flex-direction:column;gap:10px"></div>
    </nav>

    <div class="scroll-merge" id="scrollMerge">
      <main class="work" id="work"><div class="work-inner" id="main-content"></div></main>

      <aside class="wire" aria-label="Live API calls">
        <div class="wire-head">
          <div class="wire-title">
            <h2>Live API calls</h2>
            <span class="sp"></span>
            <span class="chip neutral" id="wireState">connecting</span>
          </div>
          <div class="wire-sub">/_localemu/api/stream &middot; every recorded call, every account</div>
          <div class="wire-tools">
            <select id="wireFilter" aria-label="Filter calls">
              <option value="all">All calls</option>
              <option value="errors">Errors and denials</option>
              <option value="writes">Writes only</option>
              <option value="acct">This account only</option>
              <option value="external">Hide LocalEmu-internal calls</option>
            </select>
            <button class="btn sm" id="pauseBtn" type="button">Pause</button>
            <button class="btn sm ghost" id="clearBtn" type="button">Clear</button>
            <button class="btn sm ghost" id="wireHideBtn" type="button" title="Hide this panel">Hide</button>
          </div>
        </div>
        <ul class="wire-list" id="wireList"></ul>
        <div class="wire-foot"><span>Buffer <b id="bufN">0</b> / 500</span><span id="wireQueued"></span><span>Full history in CloudTrail</span></div>
      </aside>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="action-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="action-modal" id="action-modal"></div>
</div>
